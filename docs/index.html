<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://challenges.cloudflare.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>RejectBench Survey</title>
<link rel="preload" href="fonts/stix-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "STIX Two Text"; src: url(fonts/stix-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "STIX Two Text"; src: url(fonts/stix-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "STIX Two Text"; src: url(fonts/stix-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
:root {
  --paper: #F7F8FA; --ink: #1C2340; --pencil: #3E7CB1; --wash: #E6EEF7; --rule: #D3D8E2;
  --field: #A9B0C0; --muted: #586078; --redpen: #B3261E; --ok: #2E6B3F;
  --serif: "STIX Two Text", "STIX Two", "Times New Roman", Times, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); font: 400 1.125rem/1.6 var(--serif); -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
a { color: var(--pencil); text-underline-offset: .15em; }
:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; border-radius: 2px; }

.page { max-width: 64rem; margin: 0 auto; padding: 4.5rem 1.5rem 3rem; }
.row { display: grid; grid-template-columns: minmax(0, 36rem) minmax(0, 1fr); column-gap: 3.5rem; }
h1, h2 { font-weight: 600; margin: 0; }
h1 { font-size: 3.75rem; line-height: 1.02; letter-spacing: -0.015em; max-width: 12ch; }
.subtitle { font-style: italic; font-size: 1.5rem; line-height: 1.3; color: var(--muted); margin: .75rem 0 3rem; max-width: 28ch; }
.intro { margin: 0 0 2rem; }
h2 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 1rem; }
h2:focus { outline: none; }
label.field { display: block; font-weight: 600; }
.hint { font-size: 1rem; color: var(--muted); margin: .25rem 0 .75rem; }
input[type="email"] {
  font: inherit; color: var(--ink); background: #fff; width: 100%; max-width: 26rem;
  border: 1px solid var(--field); border-radius: 3px; padding: .6rem .75rem;
}
input:focus { border-color: var(--pencil); outline: 2px solid var(--pencil); outline-offset: 0; }
#turnstile:not(:empty) { margin-top: 1.25rem; }
.error { color: var(--redpen); font-style: italic; margin: .75rem 0 0; font-size: 1rem; }
.error:empty { display: none; }
.actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; }
button, .btn { font: 600 1.0625rem/1 var(--serif); cursor: pointer; }
.btn { display: inline-block; background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; padding: .85rem 1.5rem; text-decoration: none; }
.btn:hover { background: var(--pencil); color: var(--paper); }
.btn[disabled] { opacity: .55; cursor: progress; }
.link { background: none; border: 0; padding: 0; color: var(--pencil); font-weight: 400; font-size: 1rem; text-decoration: underline; text-underline-offset: .15em; }
.link[disabled] { color: var(--muted); text-decoration: none; cursor: default; }
.note { border-left: 1px solid var(--rule); padding-left: 1.1rem; font-size: 1rem; line-height: 1.55; color: var(--muted); }
.note h3 { font-size: 1rem; color: var(--ink); margin: 0 0 .5rem; font-weight: 600; }
.note ul { margin: 0; padding: 0; list-style: none; }
.note li + li { margin-top: .75rem; }
.going { color: var(--ok); }
footer { margin-top: 5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); font-size: .9375rem; color: var(--muted); max-width: 36rem; }
footer p { margin: 0; }
@media (max-width: 52rem) {
  .row { grid-template-columns: minmax(0, 1fr); }
  aside { margin-top: 2.5rem; }
}
@media (max-width: 40rem) {
  html { font-size: 106.25%; }
  .page { padding-top: 2.75rem; }
  h1 { font-size: 2.75rem; }
  .subtitle { font-size: 1.25rem; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <div class="row">
    <main>
      <!-- email -->
      <section id="view-email">
        <p class="intro" id="intro"></p>
        <form id="email-form" novalidate>
          <h2 tabindex="-1">Enter your institutional email</h2>
          <label class="field" for="email">Institutional email</label>
          <p class="hint" id="email-hint">Use your university or research-institute address.</p>
          <input id="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" aria-describedby="email-hint email-error">
          <div id="turnstile"></div>
          <p class="error" id="email-error" role="alert"></p>
          <div class="actions"><button class="btn" type="submit" id="send-btn">Continue to the survey</button></div>
        </form>
      </section>

      <!-- redirecting / returning -->
      <section id="view-go" hidden>
        <h2 tabindex="-1" id="go-title">Verified</h2>
        <p id="go-text"></p>
        <div class="actions">
          <a class="btn" id="go-link" href="#" rel="noreferrer">Go to the survey</a>
          <button class="link" type="button" id="go-other">Use a different email</button>
        </div>
      </section>

      <!-- messages -->
      <section id="view-message" hidden>
        <h2 tabindex="-1" id="message-title"></h2>
        <p id="message-text"></p>
        <div class="actions"><button class="link" type="button" id="message-back">Use a different email</button></div>
      </section>
    </main>

    <aside aria-labelledby="privacy-title">
      <div class="note">
        <h3 id="privacy-title">How your email is used</h3>
        <ul id="privacy"></ul>
      </div>
    </aside>
  </div>

  <footer><p id="footer-text"></p></footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
